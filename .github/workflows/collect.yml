name: 아침 AI 편지 — 소식 모으기

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6:17 (한국 시간)
    - cron: "17 9 * * *"    # 매일 오후 6:17 (한국 시간)
  workflow_dispatch: {}     # Actions 화면의 'Run workflow' 단추로 직접 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 모으고 요약하기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python collector/collect.py

      - name: 결과 저장(커밋)
        run: |
          # Vercel 무료 플랜은 저장소 주인이 만든 커밋만 배포하므로 주인 이름으로 커밋한다
          git config user.name "shanghun099-web"
          git config user.email "248085989+shanghun099-web@users.noreply.github.com"
          git add site/data state
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "소식 모음 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
