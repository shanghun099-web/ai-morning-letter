<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>아침 AI 편지</title>
<meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151D1B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-title" content="아침AI">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <picture>
    <source srcset="img/header-dark.webp" media="(prefers-color-scheme: dark)">
    <img src="img/header-light.webp" alt="" class="hero-img" width="1536" height="512">
  </picture>
  <div class="hero-text">
    <h1>아침 AI 편지</h1>
    <p id="heroDate">불러오는 중…</p>
  </div>
</header>

<main>
  <nav class="daynav" aria-label="날짜 고르기">
    <button id="prevDay" type="button" aria-label="이전 날">‹ 이전</button>
    <span id="dayLabel"></span>
    <button id="nextDay" type="button" aria-label="다음 날">다음 ›</button>
  </nav>

  <section id="brief" class="brief" hidden>
    <h2>오늘의 3줄</h2>
    <ol id="briefList"></ol>
  </section>

  <nav id="cats" class="cats" aria-label="분류"></nav>

  <section id="list" class="list" aria-live="polite"></section>

  <section id="tools" class="tools" hidden>
    <h2>🛠 내가 쓰는 도구 업데이트</h2>
    <div id="toolList"></div>
  </section>

  <footer id="status" class="status"></footer>
</main>

<template id="cardTpl">
  <article class="card">
    <div class="meta"><span class="imp"></span><span class="cat"></span><span class="src"></span><span class="when"></span></div>
    <h3 class="title"></h3>
    <p class="sum"></p>
    <p class="why"></p>
    <p class="idea"></p>
    <p class="also"></p>
    <div class="acts">
      <a class="open" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>
      <button class="star" type="button" aria-pressed="false">☆ 찜</button>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
