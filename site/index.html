<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>아침 AI 편지</title>
<meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151D1B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-title" content="아침AI">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <picture>
    <source srcset="img/header-dark.webp" media="(prefers-color-scheme: dark)">
    <img src="img/header-light.webp" alt="" class="hero-img" width="1536" height="512">
  </picture>
  <div class="hero-text">
    <h1>아침 AI 편지</h1>
    <p id="heroDate">불러오는 중…</p>
  </div>
  <button id="gptOpen" class="gpt-open" type="button">⚙ GPT 키</button>
</header>

<dialog id="gptDialog" class="gpt-dialog" aria-labelledby="gptTitle">
  <h2 id="gptTitle">GPT 키 (이 폰에만 저장)</h2>
  <p class="gpt-help">카드의 <b>🔍 GPT로 더 자세히</b>, <b>❓ 물어보기</b> 단추를 누를 때만 쓰여요.
    키는 이 브라우저 안에만 저장되고, OpenAI 말고는 어디로도 보내지 않아요. 매일 자동 수집에는 쓰이지 않아요.</p>
  <label for="gptKey">OpenAI API 키</label>
  <div class="gpt-row">
    <input id="gptKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-로 시작하는 키">
    <button id="gptShow" type="button">보기</button>
  </div>
  <label for="gptModel">모델</label>
  <input id="gptModel" list="gptModels" autocomplete="off" spellcheck="false">
  <datalist id="gptModels">
    <option value="gpt-5-mini">싸고 빠름 (추천)</option>
    <option value="gpt-5">더 똑똑함, 더 비쌈</option>
    <option value="gpt-5-nano">가장 쌈</option>
  </datalist>
  <label class="gpt-check"><input id="gptWeb" type="checkbox"> 원문을 웹에서 찾아 읽고 답하기 (더 정확, 조금 더 비쌈)</label>
  <div class="gpt-row gpt-btns">
    <button id="gptTest" type="button">연결 시험</button>
    <button id="gptSave" type="button" class="primary">저장</button>
    <button id="gptClear" type="button">키 지우기</button>
  </div>
  <p id="gptMsg" role="status"></p>
  <p class="gpt-help">💡 안심하려면 OpenAI 사이트의 <a href="https://platform.openai.com/settings/organization/limits" target="_blank" rel="noopener noreferrer">사용 한도</a>에서 한 달 한도(예: 5달러)를 걸어 두세요. 폰을 잃어버리면 OpenAI 사이트에서 이 키를 지우면 돼요.</p>
  <p id="gptUsage" class="gpt-help"></p>
  <button id="gptClose" type="button" class="gpt-close">닫기</button>
</dialog>

<main>
  <nav class="daynav" aria-label="날짜 고르기">
    <button id="prevDay" type="button" aria-label="이전 날">‹ 이전</button>
    <span id="dayLabel"></span>
    <button id="nextDay" type="button" aria-label="다음 날">다음 ›</button>
  </nav>

  <section id="brief" class="brief" hidden>
    <h2>오늘의 3줄</h2>
    <ol id="briefList"></ol>
  </section>

  <nav id="cats" class="cats" aria-label="분류"></nav>

  <section id="list" class="list" aria-live="polite"></section>

  <section id="tools" class="tools" hidden>
    <h2>🛠 내가 쓰는 도구 업데이트</h2>
    <div id="toolList"></div>
  </section>

  <footer id="status" class="status"></footer>
</main>

<template id="cardTpl">
  <article class="card">
    <div class="meta"><span class="imp"></span><span class="cat"></span><span class="src"></span><span class="when"></span></div>
    <h3 class="title"></h3>
    <p class="sum"></p>
    <p class="why"></p>
    <p class="idea"></p>
    <p class="also"></p>
    <div class="acts">
      <a class="open" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>
      <button class="star" type="button" aria-pressed="false">☆ 찜</button>
    </div>
  </article>
</template>

<script src="gpt.js"></script>
<script src="app.js"></script>
</body>
</html>
